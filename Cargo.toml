[workspace]
resolver = "3"
members = ["crates/core", "crates/devtools", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
rybalka-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
ts-rs = "12"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2
